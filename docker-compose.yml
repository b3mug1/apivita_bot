services:
  db:
    image: postgres:16-alpine
    container_name: apivita_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-apivita_db}
      POSTGRES_USER: ${DB_USER:-apivita_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password_here}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - apivita_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-apivita_user} -d ${DB_NAME:-apivita_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: apivita_bot
    profiles:
      - polling
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=db
    volumes:
      - .:/app

volumes:
  apivita_postgres_data:

