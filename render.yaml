databases:
  - name: apivita-db
    databaseName: apivita_db
    user: apivita_user
    plan: free
    region: frankfurt

services:
  - type: web
    name: apivita-bot
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "1169980105"
      - key: DATABASE_URL
        fromDatabase:
          name: apivita-db
          property: connectionString
